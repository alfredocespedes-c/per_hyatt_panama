<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hyatt Regency Panama City · Pepsi</title>
<meta name="theme-color" content="#000000">
<style>
:root{--navy:#000;--navy2:#171B36;--gold:#E94A10;--blue:#004D9D;--blue2:#2A4498;--indigo:#2B2F88;--red:#E94A10;--ice:#9fb3e8;--ink:#000;--paper:#f3f6ff}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#000;color:#fff;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;overflow:hidden}
canvas#gl{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#fade{position:fixed;inset:0;background:#000;pointer-events:none;opacity:1}
#title{position:fixed;left:0;right:0;bottom:12vh;text-align:center;pointer-events:none;opacity:0;letter-spacing:.32em;text-transform:uppercase}
#title .k{font-size:clamp(11px,1.4vw,14px);color:#c8a46b}
#title .n{font-family:Georgia,"Times New Roman",serif;font-size:clamp(26px,4.4vw,54px);letter-spacing:.14em;margin-top:8px;text-shadow:0 4px 30px rgba(0,0,0,.6)}
#skip{position:fixed;right:18px;top:calc(14px + env(safe-area-inset-top));background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:9px 16px;font:600 13px/1 inherit;letter-spacing:.06em;backdrop-filter:blur(8px);cursor:pointer;z-index:5}
#survey{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 50% 14%,#004D9D 0 60px,#2A4498 60px 110px,#28347C 110px 170px,#21244D 170px 240px,#171B36 240px 320px,#0A1020 320px 400px,#000 400px),#000;z-index:6;opacity:0;transition:opacity .9s ease}
#survey.on{display:flex}#survey.show{opacity:1}
.card{width:min(560px,100%);background:rgba(10,12,20,.72);border:1px solid rgba(42,68,152,.8);border-radius:22px;padding:30px 28px 26px;box-shadow:0 30px 80px rgba(0,0,0,.45);backdrop-filter:blur(10px);transform:translateY(18px);transition:transform .9s cubic-bezier(.2,.8,.2,1)}
#survey.show .card{transform:none}
.globe{width:72px;height:72px;display:block;margin:0 0 14px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.35))}
.eyebrow{color:var(--ice);font-size:12px;letter-spacing:.3em;text-transform:uppercase}
h1{font-weight:900;text-transform:uppercase;letter-spacing:.01em;font-size:clamp(26px,5vw,34px);letter-spacing:.04em;margin:10px 0 4px}
.sub{color:#c9d3e3;font-size:15px;margin:0 0 22px}
.q{margin:0 0 16px}.q label{display:flex;gap:10px;align-items:baseline;font-size:14px;color:#e8edf5;margin-bottom:7px}
.q .num{font-weight:900;color:#fff;background:var(--blue);border-radius:50%;width:22px;height:22px;display:inline-grid;place-items:center;font-size:12px;font-size:15px;min-width:20px}
.q input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fff;font:16px inherit;outline:none;transition:border-color .2s,background .2s}
.q input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,77,157,.45);background:rgba(255,255,255,.13)}
.q input:invalid:not(:placeholder-shown){border-color:#e07a6a}
button.go{width:100%;margin-top:8px;padding:15px;border:0;border-radius:14px;background:var(--red);color:#fff;border-radius:999px;box-shadow:0 10px 30px rgba(233,74,16,.4);font:700 16px inherit;letter-spacing:.08em;cursor:pointer}
.foot{display:flex;justify-content:space-between;gap:10px;margin-top:16px;font-size:12px;color:#8fa2bf}
.foot a{color:#c9d3e3;cursor:pointer;text-decoration:underline}
.mock{position:fixed;background:rgba(6,15,31,.55);padding:4px 10px;border-radius:999px;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));font-size:11px;color:#8fa2bf;letter-spacing:.08em;z-index:7;white-space:nowrap}
#thanks{display:none;text-align:center}#thanks .check{width:74px;height:74px;margin:6px auto 16px;border-radius:50%;border:2px solid #fff;background:var(--red);display:grid;place-items:center;font-size:34px;color:#fff}
#admin{display:none;position:fixed;inset:0;overflow:auto;background:var(--paper);color:var(--ink);padding:28px;z-index:9;font-size:14px}
#admin table{border-collapse:collapse;width:100%;background:#fff}#admin th,#admin td{border:1px solid #ddd;padding:8px;text-align:left}
@media (prefers-reduced-motion:reduce){#skip{display:none}}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script></head>
<body>
<canvas id="gl"></canvas><div id="fade"></div>
<div id="title"><div class="k">Panama City</div><div class="n">Hyatt Regency</div></div>
<button id="skip" type="button">Skip intro ›</button>
<section id="survey" aria-label="Survey"><div class="card">
 <form id="f" novalidate>
  <img class="globe" src="./assets/pepsi_globe.png" alt="Pepsi"><div class="eyebrow">Pepsi · Hyatt Regency Panama&nbsp;City</div>
  <h1>Welcome, Hyatt&nbsp;team</h1><p class="sub">Four quick questions from Pepsi. It takes less than a minute.</p>
  <div class="q"><label for="gm"><span class="num">1</span>Name of General Manager</label><input id="gm" name="gm" required autocomplete="off" placeholder=" "></div>
  <div class="q"><label for="fb"><span class="num">2</span>Name of Food &amp; Beverage Director</label><input id="fb" name="fb" required autocomplete="off" placeholder=" "></div>
  <div class="q"><label for="hotel"><span class="num">3</span>Hotel Name</label><input id="hotel" name="hotel" required placeholder=" "></div>
  <div class="q"><label for="email"><span class="num">4</span>E-mail contact</label><input id="email" name="email" type="email" required inputmode="email" autocomplete="email" placeholder=" "></div>
  <button class="go" type="submit">Send</button>
  <div class="foot"><span id="err"></span><a id="replay">Replay intro</a></div>
 </form>
 <div id="thanks"><div class="check">✓</div><h1>Thank you</h1><p class="sub">Your answers were received. The Pepsi team will be in touch.</p><div class="foot" style="justify-content:center"><a id="again">New response</a></div></div>
</div></section>
<div class="mock">DEMO · answers are stored on this device only</div>
<div id="admin"></div>
<script type="module" src="./app.js"></script>
</body></html>
